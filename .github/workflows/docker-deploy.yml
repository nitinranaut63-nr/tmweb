
name: Docker CI/CD Deployment

on:
  push:
    branches:
      - docker-deployment

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nitinranaut63-nr/tmweb:latest
            ghcr.io/nitinranaut63-nr/tmweb:${{ github.sha }}

      - name: Deploy Docker container to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ghcr.io/nitinranaut63-nr/tmweb:latest

            sudo docker stop tmweb-docker-container || true
            sudo docker rm tmweb-docker-container || true

            sudo docker run -d \
              --name tmweb-docker-container \
              --restart unless-stopped \
              -p 127.0.0.1:8001:8000 \
              --env-file /home/ubuntu/tmweb-docker/.env \
              -v /home/ubuntu/tmweb-docker/docker-data:/app/data \
              ghcr.io/nitinranaut63-nr/tmweb:latest

            sleep 10
            sudo docker ps
            curl -f http://127.0.0.1:8001
